image:
  repository: hub.humanz.moe/gaming/matahari
  tag: archlinux-kde-nvidia-dev
  pullPolicy: Always

configMap:
  MangoHud: |-
    horizontal
    legacy_layout=0
    hud_no_margin
    font_size=20
    table_columns=25
    background_alpha=0.5
    gpu_stats
    gpu_temp
    cpu_stats
    cpu_temp
    ram
    vram
    fps
    frame_timing
    frametime
    toggle_hud=F8
    vulkan_driver
  steamBootstrap: |-
    # Add Genshin
    if ! ./nonsteam get | grep -q 'Genshin impact'; then
        echo "Add Genshin impact into non steam library"
        ./nonsteam add -w \
          --app-name "Genshin impact" \
          --exe '"/mnt/data/genshin/Genshin Impact game/GenshinImpact.exe"' \
          --start-dir '"/mnt/data/genshin/Genshin Impact game/"' \
          --image-grid "https://cdn2.steamgriddb.com/thumb/a38cdef9f6c911c17932d6214d8a31d2.jpg" \
          --image-grid-horiz "https://cdn2.steamgriddb.com/thumb/a0e58c078833b1ff8654ae48cdc26267.jpg" \
          --image-hero "https://cdn2.steamgriddb.com/hero_thumb/58c80ac32913fe75b84cf00a8eed5515.jpg" \
          --image-logo "https://cdn2.steamgriddb.com/logo_thumb/944eefd22dfe99fe7631b8ecc732c7cf.png" \
          --launch-options "mangohud %command%" \
          --allow-overlay
    fi

    # Add steam compatibility tools
    COMPAT_DIR="/home/kde/.local/share/Steam/compatibilitytools.d"
    TOOL_DIR="$COMPAT_DIR/dwproton-11.0-15-x86_64"
    TOOL_ARCHIVE="dwproton-11.0-15-x86_64.tar.xz"

    mkdir -p "$COMPAT_DIR"
    cd "$COMPAT_DIR" || exit 1

    if [ -d "$TOOL_DIR" ]; then
        echo "Dwproton already installed at $TOOL_DIR"
    else
        echo "Downloading Dwproton compatibility tools"
        wget "https://dawn.wine/dawn-winery/dwproton/releases/download/dwproton-11.0-15/dwproton-11.0-15-x86_64.tar.xz" -O "$TOOL_ARCHIVE"
        tar -xf "$TOOL_ARCHIVE"
        chown -R 1000:1000 "$TOOL_DIR"
        rm -f "$TOOL_ARCHIVE"
    fi

service:
  env:
    - name: OUTPUT_MODE
      value: "1920x1080@144"
    - name: TIMEZONE
      value: "Asia/Jakarta"
    - name: ROOTLESS
      value: "true"
    - name: LOCK_SCRREN_WALLPAPER_URL
      value: https://storage.humanz.moe/humanz-blog/kano_matchach.jpeg

  additionalPVC:
    - name: steam-compatibilitytools
      pvcName: steam-compatibilitytools-pvc
      mountPath: /home/kde/.local/share/Steam/compatibilitytools.d

    - name: endfield-volume
      pvcName: endfield-pvc
      mountPath: /mnt/data/endfield

    - name: genshin-volume
      pvcName: genshin-pvc
      mountPath: /mnt/data/genshin

    - name: zzz-volume
      pvcName: zzz-pvc
      mountPath: /mnt/data/zzz

    - name: warthunder-volume
      pvcName: warthunder-pvc
      mountPath: /mnt/data/warthunder

  additionalLocalPath:
    - name: steam-local-game
      HostPath: /opt/steam_game/
      mountPath: /mnt/steam_game/

    - name: steam-local-shadercache
      HostPath: /opt/steam_shadercache/
      mountPath: /home/kde/.local/share/Steam/steamapps/shadercache

  volumeClaimTemplates:
    - name: matahari-config
      size: 64Mi
      storageClass: ceph-rbd
      mountPath: /home/kde/.config/sunshine/
      chown: True

    - name: steam-config
      size: 20G
      storageClass: ceph-rbd
      mountPath: /home/kde/.local/share/Steam
      chown: True

    - name: warthunder-config
      size: 64Mi
      storageClass: ceph-rbd
      mountPath: /home/kde/.config/WarThunder
      chown: True
