name: Build the arch linux base image from git tag

on:
  push:
    tags:
      - "*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: Builder
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        # Buildx is a Docker CLI plugin for extended build capabilities,
        # including multi-platform builds.
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: hub.humanz.moe
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push arch linux image base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.archlinux
          push: true
          tags: hub.humanz.moe/gaming/matahari:archlinux-kde-nvidia-${{ github.ref_name }}
          build-args: |
            GPU=NVIDIA
      
      ### TODO: build the image for amd gpu