name: Build the arch linux base image from git tag

on:
  push:
    tags:
      - "*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: Builder
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Buildah and Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install --yes buildah skopeo

      - name: Build arch linux image base
        run: >-
          buildah bud
          --format docker
          --build-arg GPU=NVIDIA
          --file ./Dockerfile.archlinux
          --tag localhost/matahari:archlinux-kde-nvidia-${GITHUB_REF_NAME}
          .

      - name: Log in to Harbor with Skopeo
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: printf '%s' "$HARBOR_PASSWORD" | skopeo login --username "$HARBOR_USERNAME" --password-stdin hub.humanz.moe

      - name: Push arch linux image base
        run: >-
          skopeo copy
          containers-storage:localhost/matahari:archlinux-kde-nvidia-${GITHUB_REF_NAME}
          docker://hub.humanz.moe/gaming/matahari:archlinux-kde-nvidia-${GITHUB_REF_NAME}
      
