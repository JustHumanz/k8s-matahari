name: Build the arch linux base image from git tag

on:
  push:
    tags:
      - "*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: Builder
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Buildah and Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install --yes buildah skopeo

      - name: Build arch linux image base
        run: >-
          buildah bud
          --format docker
          --build-arg GPU=NVIDIA
          --file ./Dockerfile.archlinux
          --tag localhost/matahari:archlinux-kde-nvidia-${GITHUB_REF_NAME}
          .

      - name: Log in to Harbor with Skopeo
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          printf '%s' "$HARBOR_PASSWORD" |
            skopeo login \
              --authfile "$RUNNER_TEMP/containers-auth.json" \
              --username "$HARBOR_USERNAME" \
              --password-stdin \
              hub.humanz.moe

      - name: Push arch linux image base
        run: |
          set -euo pipefail
          image="localhost/matahari:archlinux-kde-nvidia-${GITHUB_REF_NAME}"
          archive_dir="$(mktemp -d "$RUNNER_TEMP/matahari-XXXXXX")"
          archive="$archive_dir/image.tar"
          trap 'rm -rf "$archive_dir"' EXIT
          buildah push "$image" "docker-archive:$archive:$image"
          docker run --rm --privileged \
            --volume "$archive:/image.tar:ro" \
            --volume "$RUNNER_TEMP/containers-auth.json:/auth.json:ro" \
            quay.io/skopeo/stable copy \
            --authfile /auth.json \
            "docker-archive:/image.tar:$image" \
            "docker://hub.humanz.moe/gaming/matahari:archlinux-kde-nvidia-${GITHUB_REF_NAME}"
      
