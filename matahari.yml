---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sunshine-config
  labels:
    app: sunshine
data:
  sunshine.conf: |
    origin_web_ui_allowed = wan
    csrf_allowed_origins = https://192.168.20.250:47990,https://matahari-kde-0.matahari-desktop.gaming.svc.cluster.local:47990
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mangohud-config
  labels:
    app: sunshine
data:
  MangoHud.conf: |
    horizontal
    legacy_layout=0
    hud_no_margin
    font_size=20
    table_columns=25
    background_alpha=0.5
    gpu_stats
    gpu_temp
    cpu_stats
    cpu_temp
    ram
    vram
    fps
    frame_timing
    frametime
    toggle_hud=F8
    vulkan_driver
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: matahari-kde
  labels:
    app: matahari-kde
spec:
  serviceName: matahari-desktop
  replicas: 1
  selector:
    matchLabels:
      app: matahari-kde
  template:
    metadata:
      labels:
        app: matahari-kde
      annotations:
        kubectl.kubernetes.io/default-container: "pod-desktop"        
    spec:
      runtimeClassName: nvidia
      dnsPolicy: ClusterFirstWithHostNet
      shareProcessNamespace: true
      initContainers:
        - name: chown-dir
          image: busybox:latest
          command: ["sh", "-c", "chown -R 1000:1000 /home/kde/.config/ /home/kde/.local/share/Steam /home/kde/.config/WarThunder"]
          volumeMounts:
            - name: config
              mountPath: /home/kde/.config/sunshine/
            - name: steam-storage
              mountPath: /home/kde/.local/share/Steam
            - name: steam-local-shadercache
              mountPath: /home/kde/.local/share/Steam/steamapps/shadercache              
            - name: warthunder-config
              mountPath: /home/kde/.config/WarThunder
          securityContext:
            runAsUser: 0
      containers:
        - name: udevadm-desktop
          image: hub.humanz.moe/gaming/matahari:archlinux-kde-latest
          imagePullPolicy: Always
          securityContext:
            privileged: true
            capabilities:
              add:
              - NET_ADMIN
              - SYS_ADMIN
              - SYS_NICE
              - SYS_PTRACE
            runAsUser: 1000
            runAsGroup: 1000
          command: ["/bin/bash", "-c", "udevadm monitor"]

        - name: pod-desktop
          image: hub.humanz.moe/gaming/matahari:archlinux-kde-latest
          imagePullPolicy: Always
          securityContext:
            privileged: true
            capabilities:
              add:
              - NET_ADMIN
              - SYS_ADMIN
              - SYS_NICE
              - SYS_PTRACE
            runAsUser: 1000
            runAsGroup: 1000
          livenessProbe:
            tcpSocket:
              port: sun-tcp-48010
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: sun-tcp-48010
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 2
          ports:
            - name: sun-tcp-47984
              containerPort: 47984
              hostPort: 47984
              protocol: TCP
            - name: sun-tcp-47985
              containerPort: 47985
              hostPort: 47985
              protocol: TCP
            - name: sun-tcp-47986
              containerPort: 47986
              hostPort: 47986
              protocol: TCP
            - name: sun-tcp-47987
              containerPort: 47987
              hostPort: 47987
              protocol: TCP
            - name: sun-tcp-47988
              containerPort: 47988
              hostPort: 47988
              protocol: TCP
            - name: sun-tcp-47989
              containerPort: 47989
              hostPort: 47989
              protocol: TCP
            - name: sun-tcp-47990
              containerPort: 47990
              hostPort: 47990
              protocol: TCP
            - name: sun-tcp-48010
              containerPort: 48010
              hostPort: 48010
              protocol: TCP
            - name: sun-udp-47998
              containerPort: 47998
              hostPort: 47998
              protocol: UDP
            - name: sun-udp-47999
              containerPort: 47999
              hostPort: 47999
              protocol: UDP
            - name: sun-udp-48000
              containerPort: 48000
              hostPort: 48000
              protocol: UDP
          env:
            - name: OUTPUT_MODE
              value: "1920x1080@144"
            - name: TIMEZONE
              value: "Asia/Jakarta"
            - name: KDE_PASSWORD
              value: "SuperSecretAgent123"
              #valueFrom:
              #  secretKeyRef:
              #   name: matahari-kde-secret
              #    key: KDE_PASSWORD
            - name: ROOTLESS
              value: "true"
          volumeMounts:
            - name: dev-input
              mountPath: /dev/input
            - name: run-udev
              mountPath: /run/udev
            - name: dev-dri
              mountPath: /dev/dri
            - name: dev-fuse
              mountPath: /dev/fuse
            - name: dshm
              mountPath: /dev/shm              
            - name: config
              mountPath: /home/kde/.config/sunshine/
            - name: sunshine-conf
              mountPath: /home/kde/.config/sunshine/sunshine.conf
              subPath: sunshine.conf
            - name: hwmon-path
              mountPath: /sys/class/hwmon/              
            - name: mangohud-conf
              mountPath: /home/kde/.config/MangoHud/MangoHud.conf
              subPath: MangoHud.conf
            - name: steam-storage
              mountPath: /home/kde/.local/share/Steam
            - name: steam-local-shadercache
              mountPath: /home/kde/.local/share/Steam/steamapps/shadercache
            - name: endfield-volume
              mountPath: /mnt/data/endfield
            - name: genshin-volume
              mountPath: /mnt/data/genshin
            - name: zzz-volume
              mountPath: /mnt/data/zzz
            - name: warthunder-volume
              mountPath: /mnt/data/warthunder
            - name: warthunder-config
              mountPath: /home/kde/.config/WarThunder
            - name: steam-local-game
              mountPath: /mnt/steam_game/
      volumes:
        - name: dev-input
          hostPath:
            path: /dev/input
            type: Directory
        - name: run-udev
          hostPath:
            path: /run/udev
            type: Directory
        - name: dev-dri
          hostPath:
            path: /dev/dri
        - name: dev-fuse
          hostPath:
            path: /dev/fuse
        - name: sunshine-conf
          configMap:
            name: sunshine-config
        - name: mangohud-conf
          configMap:
            name: mangohud-config
        - name: dshm
          emptyDir:
            medium: Memory
        - name: hwmon-path
          hostPath:
            path: /sys/class/hwmon/
        - name: endfield-volume
          persistentVolumeClaim:
            claimName: endfield-pvc 
        - name: genshin-volume
          persistentVolumeClaim:
            claimName: genshin-pvc
        - name: zzz-volume
          persistentVolumeClaim:
            claimName: zzz-pvc
        - name: warthunder-volume
          persistentVolumeClaim:
            claimName: warthunder-pvc
        - name: steam-local-game
          hostPath:
            path: /opt/steam_game/
            type: DirectoryOrCreate
        - name: steam-local-shadercache
          hostPath:
            path: /opt/steam_shadercache/
            type: DirectoryOrCreate            
      # Pin this to whichever node actually has the GPU/display hardware
      # referenced above (/dev/dri, HDMI-A-2, etc.) — see nodeSelector note below.
      nodeSelector:
        node: nvidia-gpu

  # /home/kde/.config/sunshine/, provisioned automatically as a PVC
  # named config-matahari-kde-0.
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 64Mi
        storageClassName: ceph-rbd
    - metadata:
        name: steam-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20G
        storageClassName: ceph-rbd
    - metadata:
        name: warthunder-config
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 64Mi
        storageClassName: ceph-rbd        
---
apiVersion: v1
kind: Service
metadata:
  name: matahari-desktop
  labels:
    app: matahari-kde
spec:
  clusterIP: None
  selector:
    app: matahari-kde
  ports:
    # --- TCP Ports ---
    - name: sun-tcp-47984
      protocol: TCP
      port: 47984
    - name: sun-tcp-47985
      protocol: TCP
      port: 47985
    - name: sun-tcp-47986
      protocol: TCP
      port: 47986
    - name: sun-tcp-47987
      protocol: TCP
      port: 47987
    - name: sun-tcp-47988
      protocol: TCP
      port: 47988
    - name: sun-tcp-47989
      protocol: TCP
      port: 47989
    - name: sun-tcp-47990
      protocol: TCP
      port: 47990
    - name: sun-tcp-48010
      protocol: TCP
      port: 48010
    # --- UDP Ports ---
    - name: sun-udp-47998
      protocol: UDP
      port: 47998
    - name: sun-udp-47999
      protocol: UDP
      port: 47999
    - name: sun-udp-48000
      protocol: UDP
      port: 48000